name: Build

on:
  push:
    branches:
      - dev*
      - main
      - dev-*
  pull_request:
    branches: 
      - dev*
      - main
      - dev-*

jobs:
  build:

    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v2

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.0'
        
    - name: Install swiftformat
      run: brew install swiftformat

    - name: pod install
      run: make pod-install
       
    - name: Linting
      run: make lint; make check-format

    - name: Run tests
      run: make test

    - name: Upload Code Coverage 
      uses: codecov/codecov-action@v4
      with:
        verbose: true
        name: aep-user-profile-ios

  build-swift6:
    needs: build
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v2

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.0'

    - name: pod install
      run: make pod-install

    - name: Build AEPUserProfile in Swift 6 language mode (dependencies keep their modes)
      run: make build-swift6

    - name: Build Swift 6 consumer (plain closures from @MainActor)
      run: make test-swift6-consumer
